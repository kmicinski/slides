# Quick start:   SLIDES_PASSWORD=… docker compose up -d --build
# then open http://127.0.0.1:7100/ — the password gates editing, players are public.
# Put TLS and the public hostname on a reverse proxy in front (deploy/).
services:
  slides:
    build:
      context: .
      # Set CLAUDE_CLI=1 to bake the `claude` CLI in for the ✦ Ask agent (optional;
      # also needs SLIDES_MCP_TOKEN and ANTHROPIC_API_KEY below).
      args:
        CLAUDE_CLI: ${CLAUDE_CLI:-0}
    ports:
      - "127.0.0.1:7100:7100"
    environment:
      - SLIDES_PASSWORD=${SLIDES_PASSWORD:?SLIDES_PASSWORD is required}
      # Optional. MCP endpoint for remote Claude Code sessions (empty = off).
      - SLIDES_MCP_TOKEN=${SLIDES_MCP_TOKEN:-}
      # Optional. In-app agent: needs the MCP token, the CLI (CLAUDE_CLI=1) and a key.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SLIDES_AGENT_MODEL=${SLIDES_AGENT_MODEL:-claude-opus-5}
    volumes:
      # Decks are data; themes are mounted too so schemas written through the
      # API (and by hand) persist without a rebuild. Both must be writable by uid 1000.
      - ./decks:/app/decks
      - ./themes:/app/themes
      # The agent's HOME: conversation transcripts survive restarts.
      - slides_home:/home/slides
    restart: unless-stopped

volumes:
  slides_home:
