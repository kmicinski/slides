# Proxy-auth mode with Authelia behind Caddy. Authelia's forward_auth answers
# who the user is; Caddy copies that into Remote-User for the app.
#
# Authelia needs a configuration.yml and a users_database.yml in ./authelia/
# (see README.md in this directory); this file only wires the containers.
services:
  slides:
    build:
      context: ../..
      args:
        CLAUDE_CLI: ${CLAUDE_CLI:-0}
    environment:
      - TRUST_PROXY_AUTH=true
      - SLIDES_MCP_TOKEN=${SLIDES_MCP_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SLIDES_AGENT_MODEL=${SLIDES_AGENT_MODEL:-claude-opus-5}
    volumes:
      - ./decks:/app/decks
      - ../../themes:/app/themes
      - slides_home:/home/slides
    expose: ["7100"]
    restart: unless-stopped

  authelia:
    image: authelia/authelia:4
    environment:
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_JWT_SECRET:?}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET:?}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY:?}
    volumes:
      - ./authelia:/config
    expose: ["9091"]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      - SLIDES_HOST=${SLIDES_HOST:?set SLIDES_HOST in .env}
      - AUTH_HOST=${AUTH_HOST:?set AUTH_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  slides_home:
  caddy_data:
  caddy_config:
