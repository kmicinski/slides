<!doctype html>
<!-- Generated from deck.md by slides. Edit deck.md, not this file. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="../../engine/reveal/dist/reset.css" />
    <link rel="stylesheet" href="../../engine/reveal/dist/reveal.css" />
    <link rel="stylesheet" href="../../engine/katex/katex.min.css" />
    {{THEME_CSS}}
    <style>
      /* Slides a pending proposal adds or changes (live preview of the proposed deck only). */
      .reveal .slides section[data-proposed] { outline: 4px dashed #cb4b16; outline-offset: -4px; }
      .reveal .slides section[data-proposed]::before {
        content: "proposed · " attr(data-proposed); position: absolute; top: 10px; right: 14px; z-index: 5;
        background: #cb4b16; color: #fff; font: 700 15px/1 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        letter-spacing: .06em; text-transform: uppercase; padding: 6px 10px; border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
{{SLIDES}}
      </div>
    </div>
    <script src="../../engine/reveal/dist/reveal.js"></script>
    <script src="../../engine/reveal/plugin/highlight/highlight.js"></script>
    <script src="../../engine/reveal/plugin/notes/notes.js"></script>
    <script>
      Reveal.initialize(Object.assign({{OPTIONS}}, { plugins: [RevealHighlight, RevealNotes] }));
    </script>
    {{LIVE}}
  </body>
</html>
